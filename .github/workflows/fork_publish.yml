name: Fork publish

# Builds only the extensions listed in fork-extensions.txt, signs them with the fork key
# and publishes APKs (releases) + index.pb/index.json/repo.json (branch `repo`).
on:
  push:
    branches:
      - main
      - fork-release
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish fork extensions
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve modules
        id: modules
        run: |
          modules=$(grep -v '^[[:space:]]*\(#\|$\)' fork-extensions.txt | while read -r dir; do
            [ -f "$dir/build.gradle.kts" ] || { echo "::error::$dir is not an extension module" >&2; exit 1; }
            echo ":${dir//\//:}:assembleRelease"
          done | tr '\n' ' ')
          [ -n "$modules" ] || { echo "::error::fork-extensions.txt is empty or invalid"; exit 1; }
          echo "tasks=$modules" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      - name: Prepare signing key
        id: key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "::error::SIGNING_KEY secret is not set"; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 -d > signingkey.jks
          fingerprint=$(keytool -list -v -keystore signingkey.jks -storepass "$KEY_STORE_PASSWORD" -alias "$ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          [ ${#fingerprint} -eq 64 ] || { echo "::error::could not read key fingerprint"; exit 1; }
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build extensions
        env:
          TASKS: ${{ steps.modules.outputs.tasks }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # shellcheck disable=SC2086
          ./gradlew $TASKS

      - name: Publish repo branch
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ steps.key.outputs.fingerprint }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" repo > /dev/null; then
            git clone --quiet --depth 1 --branch repo "$url" "$RUNNER_TEMP/repo"
          else
            git init --quiet --initial-branch repo "$RUNNER_TEMP/repo"
            git -C "$RUNNER_TEMP/repo" remote add origin "$url"
          fi
          python -m pip install --user --upgrade protobuf
          cd "$RUNNER_TEMP/repo"
          python -u "$GITHUB_WORKSPACE/.github/scripts/fork-publish.py" "$GITHUB_WORKSPACE" "$GITHUB_SHA" "$FINGERPRINT" "$GITHUB_WORKSPACE"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update fork extensions repo (${GITHUB_SHA::7})"
            git push origin repo
          fi

      - name: Clean up signing key
        if: always()
        run: rm -f signingkey.jks
